name: ASR Docker image

on:
  workflow_run:
    workflows: ["ASR Tests"]
    types: [completed]
    branches: ["master"]
  # Allows building the image from a branch before it is merged, which is how
  # the image is verified while the service is not yet deployed.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build_and_publish:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Github Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract version from pyproject.toml
        id: get_version
        working-directory: ./asr
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - name: Build and push the image
        uses: docker/build-push-action@v7
        with:
          context: ./asr
          push: true
          tags: |
            ghcr.io/asr4memory/mmt-asr:latest
            ghcr.io/asr4memory/mmt-asr:${{ steps.get_version.outputs.version }}
          build-args: |
            VERSION=${{ steps.get_version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
