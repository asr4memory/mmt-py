[project]
name = "mmt-py"
version = "0.1.0"
description = "Python implementation of Media Management Tool"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL"
license-files = ["LICENSE"]
dependencies = [
    "aiofiles>=24.1.0",
    "celery>=5.5.1",
    "django>=5.2",
    "django-environ>=0.12.0",
    "django-htmx>=1.23.0",
    "django-json-widget>=2.0.1",
    "django-vite>=3.1.0",
    "django-widget-tweaks>=1.5.0",
    "mysqlclient>=2.2.7",
    "redis>=5.2.1",
    "watchdog>=6.0.0",
]

[dependency-groups]
dev = [
    "ansible>=11.5.0",
    "bpython>=0.25",
    "django-debug-toolbar>=5.1.0",
    "django-extensions>=4.1",
]
prod = [
    "django-storages>=1.14.5",
    "hypercorn>=0.17.3",
    "sentry-sdk[django]>=2.24.1",
    "whitenoise>=6.9.0",
]
