[project]
name = "mmt"
version = "2026.10.7"
description = "Administration software for media files"
readme = "README.md"
requires-python = ">=3.14"
license = "AGPL"
license-files = ["LICENSE"]
dependencies = [
    "celery~=5.5",
    "django-allauth[socialaccount]~=65.19",
    "django-import-export~=4.4.1",
    "django-json-widget~=2.1.0",
    "django-silk~=5.6",
    "django-tinymce~=5.0.0",
    "django-vite~=3.1",
    "django-widget-tweaks~=1.5",
    "django~=6.1.0",
    "mysqlclient~=2.2",
    "redis~=8.0",
    "sentry-sdk[django]~=2.68",
    "weasyprint>=69.0",
    "whitenoise~=6.9",
    "python-magic>=0.4.27",
    "pydantic~=2.13.4",
    "anyascii~=0.3.3",
    "gunicorn~=26.2",
    "python-dotenv~=1.2",
]

[dependency-groups]
dev = [
    "bpython~=0.25",
    "bs4~=0.0.2",
    "django-debug-toolbar~=8.0.0",
    "django-extensions~=4.1",
    "djlint~=1.46.0",
    "locust>=2.46.6",
    "pytest~=9.1.0",
    "pytest-django~=4.14",
    "selenium~=4.50.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "mmt.settings.test"
filterwarnings = ["default"]
# Keep the test database between runs. After adding a migration, the database
# has to be rebuilt once with `uv run pytest --create-db`.
addopts = ["--reuse-db"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint.per-file-ignores]
# Each environment module extends the base settings with a star import.
"mmt/settings/*.py" = ["F403", "F405"]

[tool.djlint]
profile = "django"
indent = 4
