root /home/app/web/staticfiles;

server {
    listen 80;
    server_name laomake.de www.laomake.de;

    #ssl_certificate /home/deploy/certs/cert.pem;
    #ssl_certificate_key /home/deploy/certs/key.pem;

    auth_basic "Restricted Content";
    auth_basic_user_file /etc/nginx/.htpasswd;

    gzip on;
    gzip_types text/css application/javascript;

    access_log /var/log/mmt_access.log;
    error_log /var/log/mmt_error.log;

    client_body_timeout 7d;
    client_max_body_size 1000g;

    # Custom regex if statement to 444 any unexpected host header.
    if ( $host !~* ^(www.laomake.de|laomake.de)$ ) {
        return 444;
    }

    location / {
        proxy_pass http://backend;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    location /static/ {
        alias /home/app/web/build/;
        expires 30d;
    }
}
