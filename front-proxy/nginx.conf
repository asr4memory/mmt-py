worker_processes auto;

events {}

# HTTPS connections are forwarded without being decrypted. The domain is read
# from the server name (SNI) in the TLS handshake, and the client address is
# sent to the instance in a PROXY protocol header. A connection for a domain
# that is not listed is closed.
stream {
    map $ssl_preread_server_name $instance {
        mmt.example.org          127.0.0.1:8443;
        staging.mmt.example.org  127.0.0.1:9443;
    }

    server {
        listen 443;
        ssl_preread on;
        proxy_pass $instance;
        proxy_protocol on;
    }
}

# Plain HTTP is only redirected to HTTPS.
http {
    server {
        listen 80;
        return 301 https://$host$request_uri;
    }
}
