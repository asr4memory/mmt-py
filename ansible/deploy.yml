---
- name: Deploy
  hosts: server
  remote_user: deploy
  tasks:
    - name: Upgrade packages
      apt:
        upgrade: safe

    - name: Check out Github repo
      git:
        repo: 'https://github.com/asr4memory/mmt-py.git'
        dest: /home/deploy/django-mmt
        single_branch: yes
        version: master
        update: yes

    - name: Touch configuration file
      ansible.builtin.file:
        path: /home/deploy/django-mmt/.env.prod
        state: touch

    - name: Tear down existing services
      become: true
      community.docker.docker_compose_v2:
        files: [docker-compose.prod.yml]
        project_src: /home/deploy/django-mmt
        state: absent

    - name: Create and start services
      become: true
      community.docker.docker_compose_v2:
        files: [docker-compose.prod.yml]
        project_src: /home/deploy/django-mmt
        build: always

    - name: Prune everything to prevent disk overflow
      become: true
      community.docker.docker_prune:
        containers: true
        images: true
        networks: true
        volumes: true
        builder_cache: true
