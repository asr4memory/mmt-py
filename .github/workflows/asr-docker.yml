name: ASR Docker image

# The image contains the torch and CUDA wheels, roughly 4 GB, so the build cache
# is kept in the registry under the buildcache tag: the GitHub Actions cache is
# limited to 10 GB per repository and uploads layers of this size slowly. "ASR
# Tests" is filtered to asr/**, so this workflow only runs when the ASR service
# itself changes. It can also be started from the Actions tab, selecting the
# branch to build from.
on:
  workflow_run:
    workflows: ["ASR Tests"]
    types: [completed]
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build_and_publish:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      # The commit that was tested, which is not necessarily the head of master
      # by the time this workflow starts. On a manual run the reference is empty
      # and the selected branch is checked out.
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Github Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Deliberately not the version in pyproject.toml: that file is an input of
      # the layer that installs torch and the CUDA wheels, so bumping it for a
      # release would rebuild roughly 4 GB of layers that every host then pulls
      # again. The version in pyproject.toml is unused and stays as it is.
      - name: Extract version from VERSION
        id: get_version
        working-directory: ./asr
        run: echo "version=$(cat VERSION)" >> $GITHUB_OUTPUT
      # The ASR service has no release tag in git, so the tag named after the
      # version is written by the first build that carries a new version and is
      # left untouched afterwards. latest and the tag named after the commit are
      # written on every build; the commit tag is never reused, so no published
      # image is ever replaced by a different one.
      - name: Assemble the image tags
        id: image_tags
        run: |
          IMAGE=ghcr.io/asr4memory/mmt-asr
          VERSION="${{ steps.get_version.outputs.version }}"
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          {
            echo "tags<<TAGS"
            echo "$IMAGE:latest"
            echo "$IMAGE:$SHA"
            if docker manifest inspect "$IMAGE:$VERSION" > /dev/null 2>&1; then
              echo "$IMAGE:$VERSION already exists and is left as it is" >&2
            else
              echo "$IMAGE:$VERSION"
            fi
            echo "TAGS"
          } >> $GITHUB_OUTPUT
      - name: Build and push the image
        uses: docker/build-push-action@v7
        with:
          context: ./asr
          push: true
          tags: ${{ steps.image_tags.outputs.tags }}
          build-args: |
            VERSION=${{ steps.get_version.outputs.version }}
          cache-from: type=registry,ref=ghcr.io/asr4memory/mmt-asr:buildcache
          cache-to: type=registry,ref=ghcr.io/asr4memory/mmt-asr:buildcache,mode=max
