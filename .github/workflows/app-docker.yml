name: App Docker image

# The build of the current state of master. It publishes the latest tag and a
# tag named after the commit, so that every build is addressable and no tag is
# ever replaced by a different image. The tag named after the version is not
# written here but by "App release Docker image", which runs once per release.
on:
  workflow_run:
    workflows: ["App Tests"]
    types: [completed]
    branches: ["master"]

permissions:
  contents: read
  packages: write

jobs:
  build_and_publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      # The commit that was tested, which is not necessarily the head of master
      # by the time this workflow starts.
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Github Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract version from pyproject.toml
        id: get_version
        working-directory: ./app
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - name: Build and push the image
        uses: docker/build-push-action@v7
        with:
          context: ./app
          push: true
          tags: |
            ghcr.io/asr4memory/mmt-app:latest
            ghcr.io/asr4memory/mmt-app:${{ github.event.workflow_run.head_sha }}
          build-args: |
            VERSION=${{ steps.get_version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
