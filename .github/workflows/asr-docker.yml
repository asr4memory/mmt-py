name: ASR Docker image

# The build takes about 25 minutes because of the torch and CUDA wheels. "ASR
# Tests" is filtered to asr/**, so this workflow only runs when the ASR service
# itself changes. It can also be started from the Actions tab, selecting the
# branch to build from.
on:
  workflow_run:
    workflows: ["ASR Tests"]
    types: [completed]
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build_and_publish:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Github Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Deliberately not the version in pyproject.toml: that file is an input of
      # the layer that installs torch and the CUDA wheels, so bumping it for a
      # release would rebuild roughly 4 GB of layers that every host then pulls
      # again. The version in pyproject.toml is unused and stays as it is.
      - name: Extract version from VERSION
        id: get_version
        working-directory: ./asr
        run: echo "version=$(cat VERSION)" >> $GITHUB_OUTPUT
      - name: Build and push the image
        uses: docker/build-push-action@v7
        with:
          context: ./asr
          push: true
          tags: |
            ghcr.io/asr4memory/mmt-asr:latest
            ghcr.io/asr4memory/mmt-asr:${{ steps.get_version.outputs.version }}
          build-args: |
            VERSION=${{ steps.get_version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
