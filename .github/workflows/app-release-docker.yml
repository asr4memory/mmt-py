name: App release Docker image

# The build of a release. release.sh bumps the version in app/pyproject.toml
# and creates the matching git tag in the same commit, so the tag is pushed
# once and the image tag named after the version is written once and then
# stays on that image. The latest tag is not written here; it follows master.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Github Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The version is taken from the git tag rather than from
      # app/pyproject.toml, so that the image tag and the git tag cannot differ.
      - name: Extract version from the git tag
        id: get_version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
      # A version tag that already exists would be replaced by this build, which
      # is what the separation of the two workflows is meant to prevent.
      - name: Fail if the image tag already exists
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          if docker manifest inspect "ghcr.io/asr4memory/mmt-app:$VERSION" > /dev/null 2>&1; then
            echo "ghcr.io/asr4memory/mmt-app:$VERSION already exists, refusing to replace it"
            exit 1
          fi
      - name: Build and push the image
        uses: docker/build-push-action@v7
        with:
          context: ./app
          push: true
          tags: ghcr.io/asr4memory/mmt-app:${{ steps.get_version.outputs.version }}
          build-args: |
            VERSION=${{ steps.get_version.outputs.version }}
          cache-from: type=registry,ref=ghcr.io/asr4memory/mmt-app:buildcache
          cache-to: type=registry,ref=ghcr.io/asr4memory/mmt-app:buildcache,mode=max
