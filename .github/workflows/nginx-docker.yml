name: nginx Docker image

# The proxy has no test suite, so the image is built directly on a push to
# master that changes nginx/**. It can also be started from the Actions tab,
# selecting the branch to build from.
on:
  push:
    branches: ["master"]
    paths:
      - "nginx/**"
      - ".github/workflows/nginx-docker.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Github Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract version from VERSION
        id: get_version
        working-directory: ./nginx
        run: echo "version=$(cat VERSION)" >> $GITHUB_OUTPUT
      - name: Build and push the image
        uses: docker/build-push-action@v7
        with:
          context: ./nginx
          push: true
          tags: |
            ghcr.io/asr4memory/mmt-nginx:latest
            ghcr.io/asr4memory/mmt-nginx:${{ steps.get_version.outputs.version }}
