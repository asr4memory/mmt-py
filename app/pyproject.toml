[project]
name = "mmt"
version = "2.0.3"
description = "Administration software for media files"
readme = "README.md"
requires-python = ">=3.14"
license = "AGPL"
license-files = ["LICENSE"]
dependencies = [
    "aiofiles~=25.1",
    "celery~=5.5",
    "django-allauth[socialaccount]~=65.10",
    "django-environ~=0.12",
    "django-import-export>=4.3.14",
    "django-json-widget>=2.1.0",
    "django-storages~=1.14",
    "django-tinymce>=5.0.0",
    "django-vite~=3.1",
    "django-widget-tweaks~=1.5",
    "django~=6.0",
    "hypercorn~=0.17",
    "mysqlclient~=2.2",
    "redis~=7.0",
    "sentry-sdk[django]~=2.29",
    "watchdog~=6.0",
    "whitenoise~=6.9",
]

[dependency-groups]
dev = [
    "bpython>=0.25",
    "bs4>=0.0.2",
    "django-debug-toolbar~=6.0",
    "django-extensions~=4.1",
    "djlint>=1.36.4",
    "selenium>=4.34.2",
]

[tool.ruff.format]
quote-style = "single"
