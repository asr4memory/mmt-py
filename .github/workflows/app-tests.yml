name: App Tests

on:
  push:
    branches:
      - master
    paths:
      - "app/**"
      - ".github/workflows/app-tests.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/app-tests.yml"
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DJANGO_ENV: test
      VITE_DEV_MODE: false
      SECRET_KEY: test-secret-key
      DATABASE_NAME: mmt
      DATABASE_USER: root
      DATABASE_PASSWORD: root
      DATABASE_URL: mysql://root:root@127.0.0.1/mmt
      EMAIL_URL: dummymail://
      EMAIL_FROM: bob@example.com
      CELERY_BROKER_URL: redis://localhost

    steps:
      - uses: actions/checkout@v6
      # The install takes around 12 seconds, and nothing before "Prepare
      # Django installation" uses ffmpeg, msgfmt or the libraries weasyprint
      # needs. It therefore runs in the background while MySQL, Python, Node
      # and the assets are set up, and is waited for below. The package lists
      # of the runner image are current enough to install from, which saves the
      # 5 seconds of apt-get update; should a listed version have disappeared
      # from the mirror, the install is repeated after refreshing the lists.
      - name: Start installing system dependencies
        run: |
          nohup sudo bash -c '
            export DEBIAN_FRONTEND=noninteractive
            packages="ffmpeg gettext libharfbuzz-subset0 libpango-1.0-0 \
              libpangoft2-1.0-0"
            install="apt-get install --assume-yes --no-install-recommends \
              --quiet $packages"
            $install || { apt-get update --quiet && $install; }
            echo $? > /tmp/apt-status
          ' > /tmp/apt-log 2>&1 &
      # The runner image carries MySQL 8, stopped, with root as the password of
      # the root user. Starting it here takes a few seconds, where a service
      # container had to be pulled and initialized first, which took about 22
      # seconds of every run.
      - name: Start MySQL
        run: |
          sudo systemctl start mysql
          mysql --user=root --password=root \
            --execute="CREATE DATABASE IF NOT EXISTS mmt;"
      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install the lastest version of uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          enable-cache: true
      - name: Create upload temp directories
        working-directory: ./app
        run: |
          mkdir --parents user_files/_tmp
          mkdir --parents user_files_test/_tmp
      - name: Build assets with Node.js
        working-directory: ./app
        run: |
          npm ci
          npm run build
      - name: Wait for the system dependencies
        run: |
          for _ in $(seq 300); do
            if [ -f /tmp/apt-status ]; then break; fi
            sleep 1
          done
          cat /tmp/apt-log
          exit "$(cat /tmp/apt-status 2> /dev/null || echo 1)"
      - name: Prepare Django installation
        working-directory: ./app
        run: |
          uv sync --group dev
          uv run manage.py compilemessages --verbosity 0
          # Required: with VITE_DEV_MODE false, django-vite resolves
          # {% vite_asset %} against STATIC_ROOT/manifest.json, which only
          # exists once the built assets have been collected.
          uv run manage.py collectstatic --no-input --verbosity 0
      - name: Run Django tests
        working-directory: ./app
        run: |
          echo "Django $(uv run django-admin --version)"
          uv run pytest --ignore=mmt/core/tests/test_selenium.py --ignore=mmt/projects/tests/test_selenium.py

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install Node.js dependencies
        working-directory: ./app
        run: npm ci
      - name: Run the TypeScript typecheck
        working-directory: ./app
        run: npm run typecheck
      - name: Run Vitest tests
        working-directory: ./app
        run: npm test
