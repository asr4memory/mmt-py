name: nginx Docker image

# The proxy has no test suite, so the image is built directly on a push to
# master that changes nginx/**. It can also be started from the Actions tab,
# selecting the branch to build from.
on:
  push:
    branches: ["master"]
    paths:
      - "nginx/**"
      - ".github/workflows/nginx-docker.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Github Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract version from VERSION
        id: get_version
        working-directory: ./nginx
        run: echo "version=$(cat VERSION)" >> $GITHUB_OUTPUT
      # The proxy has no release tag in git, so the tag named after the
      # version is written by the first build that carries a new version and is
      # left untouched afterwards. latest and the tag named after the commit are
      # written on every build; the commit tag is never reused, so no published
      # image is ever replaced by a different one.
      - name: Assemble the image tags
        id: image_tags
        run: |
          IMAGE=ghcr.io/asr4memory/mmt-nginx
          VERSION="${{ steps.get_version.outputs.version }}"
          SHA="${{ github.sha }}"
          {
            echo "tags<<TAGS"
            echo "$IMAGE:latest"
            echo "$IMAGE:$SHA"
            if docker manifest inspect "$IMAGE:$VERSION" > /dev/null 2>&1; then
              echo "$IMAGE:$VERSION already exists and is left as it is" >&2
            else
              echo "$IMAGE:$VERSION"
            fi
            echo "TAGS"
          } >> $GITHUB_OUTPUT
      - name: Build and push the image
        uses: docker/build-push-action@v7
        with:
          context: ./nginx
          push: true
          tags: ${{ steps.image_tags.outputs.tags }}
