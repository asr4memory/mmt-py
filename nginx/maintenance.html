<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Wartung / Maintenance – MMT</title>
    <!-- The static files are not served during maintenance, so the styles are inline. -->
    <style>
      body {
        margin: 0;
        padding: 4rem 1rem;
        font-family: system-ui, sans-serif;
        line-height: 1.5;
        color: #1f2937;
        background: #f9fafb;
      }
      main {
        max-width: 36rem;
        margin: 0 auto;
      }
      h1 {
        font-size: 1.5rem;
      }
      section + section {
        margin-top: 2.5rem;
      }
    </style>
  </head>
  <body>
    <main>
      <section lang="de">
        <h1>Wartungsarbeiten</h1>
        <p>Das Media Management Tool wird gerade gewartet und ist vorübergehend nicht erreichbar. Bitte versuchen Sie es später noch einmal.</p>
      </section>
      <section lang="en">
        <h1>Maintenance</h1>
        <p>The Media Management Tool is undergoing maintenance and is temporarily unavailable. Please try again later.</p>
      </section>
    </main>
  </body>
</html>
