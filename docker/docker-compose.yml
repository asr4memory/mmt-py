services:
  db:
    image: mariadb:11
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: password
      MARIADB_DATABASE: mmt
    healthcheck:
      test: healthcheck.sh --connect --innodb_initialized
      start_period: 60s
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - mmt

  redis:
    image: redis:7
    restart: always
    networks:
      - mmt

  web:
    image: ${MMT_APP_IMAGE}
    restart: always
    init: true
    env_file: env.list
    mem_limit: 1500m
    memswap_limit: 1500m
    healthcheck:
      test: nc -vz -w 2 localhost 8000
      start_period: 120s
    volumes:
      - user_files:/app/django-app/user_files
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - mmt

  celery:
    image: ${MMT_APP_IMAGE}
    restart: always
    init: true
    env_file: env.list
    # CPU weights instead of CPU limits: a container uses idle CPUs, and under
    # contention receives CPU time in proportion to its weight. The default
    # weight, which the web and nginx containers keep, is 1024.
    cpu_shares: 512
    mem_limit: 768m
    memswap_limit: 1280m
    command: celery --app=mmt worker --hostname=celery@%h --concurrency=2 --beat --loglevel=INFO
    healthcheck:
      test: celery --app=mmt inspect ping --destination=celery@$$HOSTNAME
    volumes:
      - user_files:/app/django-app/user_files
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - mmt

  media:
    image: ${MMT_APP_IMAGE}
    restart: always
    init: true
    env_file: env.list
    cpu_shares: 256
    mem_limit: 1024m
    memswap_limit: 1536m
    command: celery --app=mmt worker --queues=media --hostname=media@%h --concurrency=1 --loglevel=INFO
    healthcheck:
      test: celery --app=mmt inspect ping --destination=media@$$HOSTNAME
    volumes:
      - user_files:/app/django-app/user_files
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - mmt

  nginx:
    image: ${MMT_NGINX_IMAGE}
    restart: always
    environment:
      MMT_WEB_UPSTREAM: web:8000
      # Only MMT_* is substituted into the template, so nginx's own variables
      # (host, scheme, proxy_add_x_forwarded_for) survive the envsubst step
      # the image runs at startup.
      NGINX_ENVSUBST_FILTER: "^MMT_"
    # The proxy is the only entry point; the web service is reached through
    # the compose network and publishes no port of its own.
    ports:
      - "8000:8080"
    volumes:
      - user_files:/srv/user_files:ro
    depends_on:
      - web
    networks:
      - mmt

  ner:
    image: ${MMT_NER_IMAGE}
    restart: always
    init: true
    cpu_shares: 256
    mem_limit: 3000m
    memswap_limit: 3000m
    healthcheck:
      test: curl -fsS http://localhost:8000/health
      start_period: 30s
      interval: 30s
      timeout: 30s
      retries: 3
    networks:
      - mmt

networks:
  mmt:

volumes:
  user_files:
  db_data:
