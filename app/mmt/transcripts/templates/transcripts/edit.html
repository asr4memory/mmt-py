{% extends "base.html" %}
{% load django_vite i18n uploaded_files_extras humanize %}
{% block title %}
    {{ transcript.label }} | {{ block.super }}
{% endblock %}
{% block content %}
<!-- Container for Vue.js app -->
<div id="transcript-container"
    data-id="{{ transcript.id }}"
    data-label="{{ transcript.label }}"
    data-media-type="{{ uploaded_file.media_type }}"
    data-language="{{ transcript.language }}"
    data-duration="{{ uploaded_file.duration|duration }}"
    data-uploaded-file="{{ uploaded_file.filename }}"
    data-uploaded-file-id="{{ uploaded_file.id }}"
    data-project-id="{{ project.id }}">
</div>
{% endblock content %}
{% block javascript %}
    {% vite_asset 'assets/js/transcript.ts' %}
{% endblock javascript %}
