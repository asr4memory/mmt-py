name: mmt-py

services:
  web:
    image: ghcr.io/marcaltmann/mmt-py
    command: hypercorn mmt.asgi:application --bind '0.0.0.0:8000'
    volumes:
      - user_files:/home/app/django-app/web/user_files
    expose:
      - 8000
    env_file:
      - ./.env.prod
    depends_on:
      - db
  celery:
    image: ghcr.io/marcaltmann/mmt-py
    command: celery -A mmt worker -l INFO
    restart: always
    volumes:
      - user_files:/home/app/django-app/web/user_files
    env_file:
      - ./.env.prod
    depends_on:
      - redis
      - db
  db:
    image: mariadb
    restart: always
    env_file:
      - ./.env.prod
    volumes:
      - mariadb_data:/var/lib/mysql
    ports:
      - 127.0.0.1:3306:3306
  redis:
    image: redis/redis-stack
    restart: always
    ports:
      - 127.0.0.1:6379:6379
      - 127.0.0.1:8001:8001


volumes:
  mariadb_data:
  user_files:
