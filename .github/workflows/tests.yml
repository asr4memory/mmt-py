name: Tests

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DJANGO_ENV: test
      SECRET_KEY: test-secret-key
      DATABASE_NAME: mmt
      DATABASE_USER: root
      DATABASE_PASSWORD: root
      DATABASE_URL: mysql://root:root@localhost/mmt
      EMAIL_URL: dummymail://
      EMAIL_FROM: bob@example.com
      CELERY_BROKER_URL: redis://localhost
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: 3.14
      - name: Install dependencies
        run: |
          sudo apt-get install \
            --assume-yes \
            --no-install-recommends \
            --quiet \
            gettext
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Set up MySQL
        working-directory: ./app
        run: |
          sudo service mysql start
          mysql -e 'CREATE DATABASE ${{ env.DATABASE_NAME }};' -u${{ env.DATABASE_USER }} -p${{ env.DATABASE_PASSWORD }}
      - name: Create upload temp directory
        working-directory: ./app
        run: |
          mkdir --parents user_files/_tmp
      - name: Build assets with Node.js
        working-directory: ./app
        run: |
          npm ci
          npm run build
      - name: Prepare Django installation
        working-directory: ./app
        run: |
          uv sync
          uv run manage.py compilemessages --verbosity 0
      - name: Run Django tests
        working-directory: ./app
        run: |
          echo "Django $(uv run django-admin --version)"
          uv run manage.py test
      - name: Run Vitest tests
        working-directory: ./app
        run: |
          npm run test
