[project]
name = "ner"
version = "0.5.1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "gliner2~=1.3",
    "torch~=2.0",
    "fastapi~=0.140.0",
    "uvicorn~=0.51.0",
]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning:torch",
    "ignore:builtin type Swig:DeprecationWarning",
]

[dependency-groups]
dev = [
    "httpx2~=2.0",
    "pytest~=9.1",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
