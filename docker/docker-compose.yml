services:
  db:
    image: mariadb:11
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: password
      MARIADB_DATABASE: mmt
    healthcheck:
      test: healthcheck.sh --connect --innodb_initialized
      start_period: 60s
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - mmt

  redis:
    image: redis:8
    restart: always
    networks:
      - mmt

  web:
    image: ${MMT_APP_IMAGE}
    restart: always
    init: true
    env_file: env.list
    mem_limit: 1500m
    memswap_limit: 1500m
    healthcheck:
      test: nc -vz -w 2 localhost 8000
      start_period: 120s
    volumes:
      - user_files:/app/django-app/user_files
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    # The proxy reaches the web app under its production container name.
    networks:
      mmt:
        aliases:
          - mmt-app-web

  celery:
    image: ${MMT_APP_IMAGE}
    restart: always
    init: true
    env_file: env.list
    # Health checks run here, not in the image's working directory /app.
    working_dir: /app/django-app
    # CPU weights instead of CPU limits: a container uses idle CPUs, and under
    # contention receives CPU time in proportion to its weight. The default
    # weight, which the web and nginx containers keep, is 1024.
    cpu_shares: 512
    mem_limit: 768m
    memswap_limit: 1280m
    command: celery --app=mmt worker --hostname=celery@%h --concurrency=2 --beat --loglevel=INFO
    healthcheck:
      test: celery --app=mmt inspect ping --destination=celery@$$(hostname)
    volumes:
      - user_files:/app/django-app/user_files
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - mmt

  media:
    image: ${MMT_APP_IMAGE}
    restart: always
    init: true
    env_file: env.list
    # Health checks run here, not in the image's working directory /app.
    working_dir: /app/django-app
    cpu_shares: 256
    mem_limit: 1024m
    memswap_limit: 1536m
    command: celery --app=mmt worker --queues=media --hostname=media@%h --concurrency=1 --loglevel=INFO
    healthcheck:
      test: celery --app=mmt inspect ping --destination=media@$$(hostname)
    volumes:
      - user_files:/app/django-app/user_files
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - mmt

  # A self-signed certificate for the proxy, written on every start.
  tls-cert:
    image: ${MMT_NGINX_IMAGE}
    entrypoint: ["openssl"]
    command: >-
      req -x509 -newkey rsa:2048 -nodes -days 30 -subj /CN=localhost
      -keyout /etc/nginx/tls/privkey.pem -out /etc/nginx/tls/fullchain.pem
    volumes:
      - tls:/etc/nginx/tls

  nginx:
    image: ${MMT_NGINX_IMAGE}
    restart: always
    # The proxy is the only entry point; the web service is reached through
    # the compose network and publishes no port of its own. The application
    # is at https://127.0.0.1:8000/.
    ports:
      - "8000:8443"
    volumes:
      - user_files:/srv/user_files:ro
      - tls:/etc/nginx/tls:ro
    depends_on:
      tls-cert:
        condition: service_completed_successfully
      web:
        condition: service_started
    networks:
      - mmt

  ner:
    image: ${MMT_NER_IMAGE}
    restart: always
    init: true
    environment:
      CELERY_BROKER_URL: redis://redis/0
      CELERY_RESULT_BACKEND: redis://redis/0
    cpu_shares: 256
    mem_limit: 3000m
    memswap_limit: 3000m
    healthcheck:
      test: celery -A tasks inspect ping -d ner@$$(hostname)
      start_period: 30s
      interval: 30s
      timeout: 30s
      retries: 3
    depends_on:
      redis:
        condition: service_started
    networks:
      - mmt

networks:
  mmt:

volumes:
  user_files:
  db_data:
  tls:
