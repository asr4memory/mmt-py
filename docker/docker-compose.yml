services:
  db:
    image: mariadb:11
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: password
      MARIADB_DATABASE: mmt
    healthcheck:
      test: healthcheck.sh --connect --innodb_initialized
      start_period: 60s
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - mmt

  redis:
    image: redis:7
    restart: always
    networks:
      - mmt

  web:
    image: ${MMT_APP_IMAGE}
    restart: always
    init: true
    env_file: env.list
    mem_limit: 1500m
    memswap_limit: 1500m
    healthcheck:
      test: nc -vz -w 2 localhost 8000
      start_period: 120s
    ports:
      - "8000:8000"
    volumes:
      - user_files:/app/django-app/user_files
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - mmt

  celery:
    image: ${MMT_APP_IMAGE}
    restart: always
    init: true
    env_file: env.list
    mem_limit: 1024m
    memswap_limit: 1536m
    command: celery -A mmt worker -B -l INFO --concurrency=4
    healthcheck:
      test: celery inspect ping
    volumes:
      - user_files:/app/django-app/user_files
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - mmt

  ner:
    image: ${MMT_NER_IMAGE}
    restart: always
    init: true
    mem_limit: 3000m
    memswap_limit: 3000m
    healthcheck:
      test: curl -fsS http://localhost:8000/health
      start_period: 30s
      interval: 30s
      timeout: 30s
      retries: 3
    networks:
      - mmt

networks:
  mmt:

volumes:
  user_files:
  db_data:
