[project]
name = "mmt"
version = "2.19.1"
description = "Administration software for media files"
readme = "README.md"
requires-python = ">=3.14"
license = "AGPL"
license-files = ["LICENSE"]
dependencies = [
    "aiofiles~=25.1",
    "celery~=5.5",
    "django-allauth[socialaccount]~=65.18",
    "django-environ~=0.12",
    "django-import-export~=4.4.1",
    "django-json-widget~=2.1.0",
    "django-storages~=1.14",
    "django-tinymce~=5.0.0",
    "django-vite~=3.1",
    "django-widget-tweaks~=1.5",
    "django~=6.0.7",
    "uvicorn~=0.49",
    "mysqlclient~=2.2",
    "redis~=8.0",
    "sentry-sdk[django]~=2.59",
    "watchdog~=6.0",
    "weasyprint>=69.0",
    "whitenoise~=6.9",
    "python-magic>=0.4.27",
    "pydantic~=2.13",
]

[dependency-groups]
dev = [
    "bpython~=0.25",
    "bs4~=0.0.2",
    "django-debug-toolbar~=7.0.0",
    "django-extensions~=4.1",
    "djlint~=1.43.2",
    "pytest~=9.1.0",
    "pytest-django~=4.11",
    "selenium~=4.46.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "mmt.settings"
filterwarnings = ["default"]

[tool.ruff.format]
quote-style = "single"

[tool.djlint]
profile = "django"
indent = 2
