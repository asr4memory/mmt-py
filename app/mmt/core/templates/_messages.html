{% load i18n %}
{% if messages %}
<div class="message-stack" data-placement="top" role="region" aria-label="Messages">
  {% for message in messages %}
  <div class="message" data-level="{{ message.tags }}"
       role="{% if message.tags == 'error' %}alert{% else %}status{% endif %}">
    <span class="message__icon" aria-hidden="true">{% include "icons/"|add:message.tags|add:".svg" %}</span>
    <p class="message__text">{{ message }}</p>
    {% if message.tags == "error" or message.tags == "warning" %}
    <button type="button" class="message__close" aria-label="{% translate 'Dismiss' %}">
      {% include "icons/x.svg" %}
    </button>
    {% endif %}
  </div>
  {% endfor %}
</div>
{% endif %}
